<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CraftVortex - MCPE Hub</title>
    <style>
        body {
            background-color: #161032;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
        }
        /* Top Bar & Search */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #231942;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .search-box {
            flex: 1;
            margin: 0 10px;
            padding: 8px 12px;
            background: #352565;
            border: none;
            border-radius: 20px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .coins {
            background: #352565;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 13px;
            color: #ffcc00;
            font-weight: bold;
        }
        .section-title {
            font-size: 15px;
            font-weight: bold;
            margin: 15px 0 8px 5px;
            color: #fff;
        }
        /* Banner Card */
        .banner {
            background: linear-gradient(135deg, #231942, #482980);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #4a3380;
            margin-bottom: 20px;
        }
        .banner img {
            width: 100%;
            height: 130px;
            object-fit: cover;
        }
        /* Categories Grid */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        .cat-card {
            background: #231942;
            border-radius: 8px;
            overflow: hidden;
            text-align: center;
            border: 1px solid #3d2a70;
            text-decoration: none;
            color: #fff;
        }
        .cat-card img {
            width: 100%;
            height: 75px;
            object-fit: cover;
        }
        .cat-card span {
            display: block;
            padding: 6px;
            font-size: 13px;
            font-weight: bold;
            background: #32215c;
        }
        /* Themes Tags */
        .themes-container {
            display: flex;
            overflow-x: auto;
            gap: 8px;
            padding-bottom: 10px;
            scrollbar-width: none;
        }
        .themes-container::-webkit-scrollbar {
            display: none;
        }
        .theme-tag {
            background: #cc1122;
            color: #fff;
            padding: 6px 14px;
            border-radius: 15px;
            font-size: 13px;
            font-weight: bold;
            white-space: nowrap;
            text-decoration: none;
            cursor: pointer;
            border: none;
        }
        /* Item Post Cards */
        .item-card {
            background: #231942;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
            border: 1px solid #3d2a70;
        }
        .item-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }
        .item-info {
            padding: 10px;
        }
        .item-info h4 {
            margin: 0 0 5px 0;
            font-size: 15px;
            color: #fff;
        }
        .item-stats {
            font-size: 11px;
            color: #b1a7d8;
            display: flex;
            gap: 12px;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <span style="font-size: 18px; cursor: pointer;">☰</span>
        <input type="text" id="searchInput" class="search-box" placeholder="Search (e.g. Waifus, Dinosaur, Skins)..." onkeyup="searchItems()">
        <div class="coins">15 🪙</div>
    </div>

    <div class="section-title">Content of the day ∧</div>
    <div class="banner">
        <img src="https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=500&auto=format&fit=crop&q=60" alt="Banner">
    </div>

    <div class="section-title">Category ∧</div>
    <div class="grid-2">
        <a href="#" class="cat-card"><img src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=300" alt="New"><span>New</span></a>
        <a href="https://wa.me/?text=I%20want%20to%20buy%20Premium%20for%20400%20PKR" class="cat-card"><img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=300" alt="Premium"><span>Premium (400 PKR)</span></a>
    </div>
    <div class="grid-2">
        <a href="#" class="cat-card"><img src="https://images.unsplash.com/photo-1511512578047-dfb367046420?w=300" alt="Maps"><span>Maps</span></a>
        <a href="#" class="cat-card"><img src="https://images.unsplash.com/photo-1538481199705-c710c4e965fc?w=300" alt="Addons"><span>Addons</span></a>
    </div>

    <div class="section-title">Themes ∧</div>
    <div class="themes-container">
        <button class="theme-tag" onclick="filterTheme('skyblock')">Skyblock</button>
        <button class="theme-tag" onclick="filterTheme('dinosaur')">Dinosaurs</button>
        <button class="theme-tag" onclick="filterTheme('waifus')">The Waifus</button>
        <button class="theme-tag" onclick="filterTheme('core')">Core Craft</button>
        <button class="theme-tag" onclick="filterTheme('bedwars')">Bedwars</button>
        <button class="theme-tag" onclick="filterTheme('fnaf')">FNAF</button>
        <button class="theme-tag" onclick="filterTheme('monsters')">Monsters</button>
    </div>

    <div class="section-title" style="margin-top:20px;">Explore Items ∧</div>

    <div id="itemList">
        <div class="item-card" data-name="the waifus party anime skins">
            <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500&auto=format&fit=crop&q=60" alt="Waifus">
            <div class="item-info">
                <h4>The Waifus Party</h4>
                <div class="item-stats"><span>📎 156.4 Mb</span><span>📥 12.6K</span><span>❤️ 2.2K</span></div>
            </div>
        </div>

        <div class="item-card" data-name="core craft survival map dinosaur">
            <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?w=500&auto=format&fit=crop&q=60" alt="Core Craft">
            <div class="item-info">
                <h4>Core Craft & Dinosaurs World</h4>
                <div class="item-stats"><span>📎 120.0 Mb</span><span>📥 9.4K</span><span>❤️ 1.8K</span></div>
            </div>
        </div>
    </div>

    <script>
        function searchItems() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('item-card');
            
            for (let i = 0; i < cards.length; i++) {
                let name = cards[i].getAttribute('data-name');
                if (name.includes(input)) {
                    cards[i].style.display = "";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }

        function filterTheme(themeName) {
            document.getElementById('searchInput').value = themeName;
            searchItems();
        }
    </script>

</body>
</html>
