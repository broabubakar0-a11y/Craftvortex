<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CraftVortex - MCPE Hub</title>
    <style>
        body {
            background-color: #161032;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
        }
        /* Top Bar & Search */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #231942;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .search-box {
            flex: 1;
            margin: 0 10px;
            padding: 8px 12px;
            background: #352565;
            border: none;
            border-radius: 20px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .coins {
            background: #352565;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 13px;
            color: #ffcc00;
            font-weight: bold;
        }
        /* Section Titles */
        .section-title {
            font-size: 15px;
            font-weight: bold;
            margin: 15px 0 8px 5px;
            color: #fff;
        }
        /* Banner Card */
        .banner {
            background: linear-gradient(135deg, #231942, #482980);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #4a3380;
            margin-bottom: 20px;
        }
        .banner img {
            width: 100%;
            height: 130px;
            object-fit: cover;
        }
        /* Categories Grid */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        .cat-card {
            background: #231942;
            border-radius: 8px;
            overflow: hidden;
            text-align: center;
            border: 1px solid #3d2a70;
            text-decoration: none;
            color: #fff;
        }
        .cat-card img {
            width: 100%;
            height: 75px;
            object-fit: cover;
        }
        .cat-card span {
            display: block;
            padding: 6px;
            font-size: 13px;
            font-weight: bold;
            background: #32215c;
        }
    </style>
</head>
<body>

    <!-- Top Bar with Search & Coins -->
    <div class="top-bar">
        <span style="font-size: 18px; cursor: pointer;">☰</span>
        <input type="text" class="search-box" placeholder="Search">
        <div class="coins">15 🪙</div>
    </div>

    <!-- Content of the day -->
    <div class="section-title">Content of the day ∧</div>
    <div class="banner">
        <img src="https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=500&auto=format&fit=crop&q=60" alt="Banner">
    </div>

    <!-- Category Section -->
    <div class="section-title">Category ∧</div>
    
    <div class="grid-2">
        <a href="#" class="cat-card">
            <img src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=300&auto=format&fit=crop&q=60" alt="New">
            <span>New</span>
        </a>
        <a href="#" class="cat-card">
            <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=300&auto=format&fit=crop&q=60" alt="Premium">
            <span>Premium (400 PKR)</span>
        </a>
    </div>

    <div class="grid-2">
        <a href="#" class="cat-card">
            <img src="https://images.unsplash.com/photo-1511512578047-dfb367046420?w=300&auto=format&fit=crop&q=60" alt="Maps">
            <span>Maps</span>
        </a>
        <a href="#" class="cat-card">
            <img src="https://images.unsplash.com/photo-1538481199705-c710c4e965fc?w=300&auto=format&fit=crop&q=60" alt="Addons">
            <span>Addons</span>
        </a>
    </div>

</body>
</html>
